---
name: Bug report
description: Report a reproducible problem in repository code, validation, or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, private keys, certificates, tokens, or production-sensitive data.
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: puppet-version
    attributes:
      label: Puppet version
      placeholder: "8.x"
  - type: textarea
    id: validation-output
    attributes:
      label: Relevant validation output
      render: shell

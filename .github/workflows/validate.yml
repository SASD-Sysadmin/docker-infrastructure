---
name: Validate control repository
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Puppet ${{ matrix.puppet }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - puppet: '7.23.0'
            ruby: '3.1'
          - puppet: '8.10.0'
            ruby: '3.3'
    env:
      PUPPET_GEM_VERSION: ${{ matrix.puppet }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install shell and YAML validators
        run: sudo apt-get update && sudo apt-get install --yes shellcheck yamllint
      - name: Run complete verification suite
        run: bundle exec rake

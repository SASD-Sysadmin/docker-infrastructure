---
name: Build release evidence
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PUPPET_GEM_VERSION: '8.10.0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install --yes shellcheck yamllint
      - name: Verify tag and version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Run complete validation
        run: bundle exec rake
      - name: Build deterministic evidence
        run: |
          mkdir -p dist
          ./scripts/release-readiness.sh --strict --output dist/readiness.json
          python3 scripts/generate-release-manifest.py --output dist/release-manifest.json
          python3 scripts/verify-release-manifest.py dist/release-manifest.json
          git archive --format=zip --prefix="puppet-software-baseline-$(cat VERSION)/" --output="dist/puppet-software-baseline-$(cat VERSION).zip" HEAD
          git archive --format=tar.gz --prefix="puppet-software-baseline-$(cat VERSION)/" --output="dist/puppet-software-baseline-$(cat VERSION).tar.gz" HEAD
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: puppet-software-baseline-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

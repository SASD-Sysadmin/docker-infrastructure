# Puppet environment configuration for this control repository.
#
# Resolution order matters:
#   1. site-modules contains SASD-owned role and profile modules.
#   2. modules contains third-party modules deployed from Puppetfile by r10k.
#   3. $basemodulepath preserves Puppet Server / Puppet Enterprise system modules.
modulepath = site-modules:modules:$basemodulepath

# Puppet normally discovers the manifests directory automatically. Declaring it
# explicitly makes the control-repository contract visible to maintainers.
manifest = manifests

# Every compiled catalog receives a traceable code identifier. Local clones use
# the Git revision; r10k deployments or exported archives without .git use the
# explicit VERSION fallback until server deployment metadata is integrated.
config_version = scripts/config_version.sh

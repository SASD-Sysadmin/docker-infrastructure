---
# Classification remains allowlisted in manifests/site.pp.
sasd::role: baseline
sasd::lifecycle_state: active

lookup_options:
  profile::baseline::packages:
    merge: unique
  profile::administration_tools::packages:
    merge: unique
  profile::development_tools::packages:
    merge: unique
  profile::container_tools::packages:
    merge: unique

profile::baseline::manage_packages: true
profile::baseline::manage_marker: true
profile::baseline::baseline_version: '0.6.0'
profile::baseline::marker_directory: '/etc/sasd'
profile::baseline::marker_file: '/etc/sasd/puppet-baseline.conf'
profile::baseline::packages:
  - ca-certificates
  - curl
  - git
  - jq
  - python3
  - rsync
  - tree
  - unzip

# General-purpose command-line administration tools. These are installed only
# by roles that explicitly compose profile::administration_tools.
profile::administration_tools::packages:
  - acl
  - attr
  - bash-completion
  - dnsutils
  - file
  - htop
  - less
  - nano
  - netcat-openbsd
  - psmisc
  - sudo
  - tcpdump
  - vim
  - zip

# Development tools come from distribution repositories; no curl-pipe-shell
# installers, language version managers, or third-party repositories are added.
profile::development_tools::packages:
  - build-essential
  - gdb
  - pkg-config
  - python3-dev
  - python3-pip
  - python3-venv
  - shellcheck

# Daemonless OCI tools. Registry configuration, image pulls, and containers are
# deliberately outside this application-installation baseline.
profile::container_tools::packages:
  - buildah
  - fuse-overlayfs
  - podman
  - skopeo
  - slirp4netns
  - uidmap

profile::agent_service::service_name: puppet
profile::agent_service::service_ensure: running
profile::agent_service::service_enable: true

profile::server_operations::state_root: '/var/lib/sasd-puppet'
profile::server_operations::report_directory: '/var/lib/sasd-puppet/reports'
profile::server_operations::health_directory: '/var/lib/sasd-puppet/health'
profile::server_operations::health_interval: '15min'

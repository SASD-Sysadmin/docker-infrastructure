---
# Automatic Parameter Lookup (APL) supplies these values to
# profile::baseline. The unique merge permits a node or platform layer to add
# packages without duplicating names already present here.
lookup_options:
  profile::baseline::packages:
    merge: unique

profile::baseline::manage_packages: true
profile::baseline::manage_marker: true
profile::baseline::baseline_version: '0.2.0'
profile::baseline::marker_directory: '/etc/sasd'
profile::baseline::marker_file: '/etc/sasd/puppet-baseline.conf'

# Small, deliberately conservative administration baseline. Every package is
# available from the standard repositories of all Milestone 2 platforms.
profile::baseline::packages:
  - ca-certificates
  - curl
  - git
  - jq
  - rsync
  - tree
  - unzip
